<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>總管家包租代管 - 租金區間試算表</title>

<!-- 引入 html2canvas 程式庫用於截圖功能 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
:root {
  --primary-color: #f39c12;
  --secondary-color: #2c3e50;
  --bg-color: #f4f7f6;
  --warn-color: #e74c3c;
  --ok-color: #27ae60;
  --fieldset-bg: #fff9eb;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", Arial, sans-serif;
  background-color: var(--bg-color);
  color: #333;
  margin: 0;
  padding: 20px;
  display: flex;
  justify-content: center;
}

.container {
  background: #fff;
  max-width: 500px;
  width: 100%;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

h1 {
  font-size: 24px;
  color: var(--secondary-color);
  text-align: center;
  margin: 0;
}

.subtitle {
  text-align: center;
  font-size: 14px;
  color: #7f8c8d;
  margin-bottom: 25px;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
  font-size: 14px;
}

input, select, button {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border: 1px solid #ddd;
  border-radius: 8px;
  box-sizing: border-box;
  font-size: 16px;
}

input:focus, select:focus {
  outline: none;
  border-color: var(--primary-color);
  box-shadow: 0 0 0 2px rgba(243, 156, 18, 0.2);
}

fieldset {
  border: 1px solid #f39c12;
  border-radius: 12px;
  padding: 18px;
  margin-top: 25px;
  background-color: var(--fieldset-bg);
}

legend {
  font-size: 14px;
  font-weight: bold;
  color: var(--primary-color);
  background-color: #fff;
  padding: 2px 12px;
  border-radius: 20px;
  border: 1px solid #f39c12;
}

.equip-group {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 10px;
}

.checkbox-item {
  display: flex;
  align-items: center;
  font-weight: normal;
  font-size: 14px;
  cursor: pointer;
  background: rgba(255,255,255,0.7);
  padding: 8px;
  border-radius: 6px;
}

.checkbox-item input {
  width: auto;
  margin-top: 0;
  margin-right: 8px;
  transform: scale(1.2);
}

.btn-primary {
  background-color: var(--primary-color);
  color: white;
  border: none;
  font-weight: bold;
  cursor: pointer;
  margin-top: 25px;
  height: 54px;
}

.btn-download {
  background-color: var(--secondary-color);
  color: white;
  border: none;
  font-weight: bold;
  cursor: pointer;
  margin-top: 15px;
  display: none; 
}

/* 結果區塊樣式 */
.result-area {
  margin-top: 30px;
  text-align: center;
  padding: 25px;
  border-radius: 12px;
  background: #fff;
  border: 2px solid #f39c12; /* 使用品牌橘色框 */
}

/* 僅截圖時顯示的報告標頭 */
.shot-header {
  display: none;
  border-bottom: 2px solid #f39c12;
  padding-bottom: 10px;
  margin-bottom: 20px;
  color: var(--secondary-color);
}

.result-title {
  font-size: 72px;
  font-weight: 900;
  margin: 5px 0;
}

.ok { color: var(--ok-color); }
.warn { color: var(--warn-color); }

.detail {
  text-align: left;
  font-size: 16px;
  line-height: 2;
  color: #333;
}

.bonus-box {
  border: 1px solid #f39c12;
  background: #fff;
  padding: 15px;
  margin-top: 15px;
  border-radius: 10px;
}

.note {
  margin-top: 20px;
  color: #e74c3c;
  font-size: 12px;
  text-align: center;
  font-weight: bold;
}

.info-icon {
  display: inline-block;
  width: 18px;
  height: 18px;
  background: var(--primary-color);
  color: #fff;
  border-radius: 50%;
  text-align: center;
  line-height: 18px;
  font-size: 12px;
  cursor: pointer;
  margin-left: 5px;
}

.tooltip-content {
  display: none;
  background: #34495e;
  color: #fff;
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
  margin-top: 5px;
  font-weight: normal;
}

.show { display: block; }

.watermark {
  display: none;
  font-size: 12px;
  color: #bdc3c7;
  text-align: right;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">
  <h1>租金區間試算表</h1>
  <div class="subtitle">總管家包租代管 專業服務</div>

  <form id="calcForm">
    <label>行政區</label>
    <select id="district" required>
      <option value="">— 請選擇行政區 —</option>
      <option>西屯區</option><option>北屯區</option><option>南屯區</option>
      <option>北區</option><option>西區</option><option>中區</option>
      <option>東區</option><option>南區</option><option>烏日區</option>
      <option>大里區</option><option>太平區</option><option>潭子區</option>
      <option>豐原區</option><option>后里區</option><option>沙鹿區</option>
      <option>龍井區</option><option>大肚區</option><option>大雅區</option>
      <option>神岡區</option><option>梧棲區</option><option>清水區</option>
      <option>大甲區</option><option>外埔區</option><option>霧峰區</option>
      <option>石岡區</option><option>東勢區</option><option>新社區</option>
      <option>其它</option>
    </select>

    <label>屋齡（年）</label>
    <input id="age" type="number" min="0" placeholder="請輸入屋齡" required>

    <label>坪數</label>
    <input id="ping" type="number" step="0.01" min="0.1" placeholder="請輸入坪數" required>

    <label>欲簽約租金（元/月）</label>
    <input id="rent" type="number" min="1" placeholder="請輸入月租金金額" required>

    <fieldset>
      <legend>額外加分項目</legend>
      <label>室內裝修 <span class="info-icon" onclick="toggleTooltip('decoTip')">?</span></label>
      <div id="decoTip" class="tooltip-content">
        <b>中等裝修 5%</b>：有天花板設計、系統櫃收納。<br>
        <b>簡易裝修 3%</b>：基本天花板油漆、基本收納。
      </div>
      <select id="deco">
        <option value="0">未裝修 (0%)</option>
        <option value="3">簡易裝修 (3%)</option>
        <option value="5">中等裝修 (5%)</option>
      </select>

      <label>區位因素 <span class="info-icon" onclick="toggleTooltip('areaTip')">?</span></label>
      <div id="areaTip" class="tooltip-content">
        <b>優質區位 5%</b>：核心商圈、交通極便捷、就業集中。<br>
        <b>中上區位 3%</b>：主要生活圈、設施水準中上。
      </div>
      <select id="area">
        <option value="0">中下區位 (0%)</option>
        <option value="3">中上區位 (3%)</option>
        <option value="5">優質區位 (5%)</option>
      </select>

      <label>設備加分 (每項 +$500，上限 $2000)</label>
      <div style="font-size: 11px; color: #d35400; margin-bottom: 8px;">※ 只計算項目種類，不計算數量</div>
      <div class="equip-group" id="equipGroup">
        <label class="checkbox-item"><input type="checkbox" value="500"> 冷氣</label>
        <label class="checkbox-item"><input type="checkbox" value="500"> 冰箱</label>
        <label class="checkbox-item"><input type="checkbox" value="500"> 電視</label>
        <label class="checkbox-item"><input type="checkbox" value="500"> 洗衣機</label>
        <label class="checkbox-item"><input type="checkbox" value="500"> 無線網路</label>
        <label class="checkbox-item"><input type="checkbox" value="500"> 第四台</label>
      </div>
    </fieldset>

    <button type="submit" class="btn-primary">確認送出試算</button>
  </form>

  <!-- 試算結果截圖區 -->
  <div id="resultArea" class="result-area" style="display:none;">
    <div class="shot-header" id="sh">
        <div style="font-size: 20px; font-weight: bold;">總管家包租代管</div>
        <div style="font-size: 14px; opacity: 0.8;">社會住宅租金區間判定報告單</div>
    </div>
    
    <div id="resultSign" class="result-title"></div>
    <div id="detailLog" class="detail"></div>
    
    <div class="watermark" id="wm">判定時間：<span id="timestamp"></span></div>
  </div>

  <button id="downloadBtn" class="btn-download">📸 下載結果判定照片</button>

  <div class="note">⚠️ 本工具僅供參考，最終租金核定以審查單位公文為準。</div>
</div>

<script>
const STUDIO_TABLE = {
"西屯區":[1120,1100,1080,1055,1025,1000,970,930,885],"北屯區":[1060,1040,1025,995,970,945,920,880,840],"南屯區":[1060,1040,1025,995,970,945,920,880,840],"北區":[1045,1030,1010,985,960,935,905,870,830],"西區":[1045,1030,1010,985,960,935,905,870,830],"中區":[1010,995,975,950,925,900,875,840,800],"東區":[1010,995,975,950,925,900,875,840,800],"南區":[985,970,955,930,905,880,855,820,780],"烏日區":[940,925,905,885,860,835,815,780,745],"大里區":[915,900,885,860,840,815,795,760,725],"潭子區":[915,900,885,860,840,815,795,760,725],"大雅區":[890,875,860,840,815,795,770,740,705],"太平區":[890,875,860,840,815,795,770,740,705],"沙鹿區":[890,875,860,840,815,795,770,740,705],"后里區":[855,840,825,805,785,760,740,710,675],"大肚區":[840,830,815,795,775,750,730,700,665],"神岡區":[840,830,815,795,775,750,730,700,665],"豐原區":[840,830,815,795,775,750,730,700,665],"梧棲區":[830,815,805,780,760,740,720,690,660],"龍井區":[830,815,805,780,760,740,720,690,660],"大甲區":[780,770,755,735,720,700,680,650,620],"外埔區":[720,710,700,680,660,645,625,600,570],"石岡區":[720,710,700,680,660,645,625,600,570],"霧峰區":[720,710,700,680,660,645,625,600,570],"清水區":[590,580,570,555,540,525,510,490,470],"新社區":[480,475,465,455,445,430,420,400,380],"東勢區":[480,475,465,455,445,430,420,400,380],"其它":[385,380,375,365,355,345,335,320,305]
};

const HOUSE_TABLE = {
"西屯區":[940,925,905,885,860,835,815,780,745],"北屯區":[900,885,870,850,830,805,780,750,715],"南屯區":[900,885,870,850,830,805,780,750,715],"北區":[890,875,860,840,815,795,770,740,705],"西區":[890,875,860,840,815,795,770,740,705],"中區":[830,815,805,780,760,740,720,690,660],"東區":[830,815,805,780,760,740,720,690,660],"烏日區":[830,815,805,780,760,740,720,690,660],"南區":[780,770,755,735,720,700,680,650,620],"大里區":[770,760,745,725,705,685,670,640,610],"太平區":[770,760,745,725,705,685,670,640,610],"潭子區":[770,760,745,725,705,685,670,640,610],"豐原區":[770,760,745,725,705,685,670,640,610],"后里區":[675,665,650,635,620,600,585,560,535],"沙鹿區":[675,665,650,635,620,600,585,560,535],"龍井區":[675,665,650,635,620,600,585,560,535],"大肚區":[660,650,640,625,605,590,575,550,525],"大雅區":[660,650,640,625,605,590,575,550,525],"神岡區":[660,650,640,625,605,590,575,550,525],"梧棲區":[600,590,580,565,550,535,520,500,475],"清水區":[580,570,560,545,530,515,500,480,460],"大甲區":[565,555,550,535,520,505,490,470,450],"外埔區":[505,500,490,475,465,450,440,420,400],"霧峰區":[505,500,490,475,465,450,440,420,400],"石岡區":[495,485,480,465,455,440,430,410,390],"東勢區":[460,450,445,430,420,410,400,380,365],"新社區":[445,440,430,420,410,400,385,370,355],"其它":[375,370,360,355,345,335,325,310,295]
};

const AGE_BANDS = [4, 9, 14, 19, 24, 29, 34, 39, 999];
const AGE_LABELS = ["0–4", "5–9", "10–14", "15–19", "20–24", "25–29", "30–34", "35–39", "40+"];

function getBandIndex(age) {
  for (let i = 0; i < AGE_BANDS.length; i++) {
    if (age <= AGE_BANDS[i]) return i;
  }
  return AGE_BANDS.length - 1;
}

function toggleTooltip(id) {
  const tip = document.getElementById(id);
  const isShow = tip.classList.contains('show');
  document.querySelectorAll('.tooltip-content').forEach(el => el.classList.remove('show'));
  if (!isShow) tip.classList.add('show');
}

document.addEventListener('click', (e) => {
  if (!e.target.classList.contains('info-icon')) {
    document.querySelectorAll('.tooltip-content').forEach(el => el.classList.remove('show'));
  }
});

document.getElementById("calcForm").onsubmit = function(e) {
  e.preventDefault();

  const district = document.getElementById("district").value;
  const age = Math.abs(parseFloat(document.getElementById("age").value));
  const ping = Math.abs(parseFloat(document.getElementById("ping").value));
  const rent = Math.abs(parseInt(document.getElementById("rent").value));
  const decoPct = parseInt(document.getElementById("deco").value);
  const areaPct = parseInt(document.getElementById("area").value);

  if (!district || isNaN(age) || isNaN(ping) || isNaN(rent)) {
    showError("請填寫完整的試算資料。");
    return;
  }

  let equipBonusTotal = 0;
  const checkboxes = document.querySelectorAll('#equipGroup input:checked');
  equipBonusTotal = checkboxes.length * 500;
  if (equipBonusTotal > 2000) equipBonusTotal = 2000;

  const isStudio = ping <= 15;
  const rentLimit = isStudio ? 21000 : 35000;
  const typeLabel = isStudio ? "套房" : "非套房";

  const resultArea = document.getElementById("resultArea");
  const resultSign = document.getElementById("resultSign");
  const detailLog = document.getElementById("detailLog");
  const downloadBtn = document.getElementById("downloadBtn");

  resultArea.style.display = "block";
  downloadBtn.style.display = "block"; 

  if (rent > rentLimit) {
    resultSign.textContent = "無法承作";
    resultSign.className = "result-title warn";
    detailLog.innerHTML = `原因：該物件為<b>${typeLabel}</b>，簽約租金上限為 <b>${rentLimit.toLocaleString()} 元</b>，您輸入的租金已超出規範。`;
    return;
  }

  const table = isStudio ? STUDIO_TABLE : HOUSE_TABLE;
  const row = table[district];
  const idx = getBandIndex(age);
  const unitPrice = row[idx];
  
  const baseMaxRent = Math.ceil(unitPrice * ping);
  const isBasePass = baseMaxRent >= rent;

  const headerHtml = `
    物件類別：<b>${typeLabel}</b><br>
    行政區：<b>${district}</b><br>
    屋齡：<b>${age} 年</b> (${AGE_LABELS[idx]})<br>
    公告單價：<b>${unitPrice} 元/坪</b><br>
    基準上限：<b>${baseMaxRent.toLocaleString()} 元</b>
  `;

  if (isBasePass) {
    resultSign.textContent = "O";
    resultSign.className = "result-title ok";
    detailLog.innerHTML = headerHtml + `<br><span style="color:#27ae60; font-weight:bold;">✅ 基礎試算合規。</span>`;
  } else {
    const decoBonus = Math.ceil(baseMaxRent * (decoPct / 100));
    const areaBonus = Math.ceil(baseMaxRent * (areaPct / 100));
    const finalMaxRent = baseMaxRent + decoBonus + areaBonus + equipBonusTotal;
    const isFinalPass = finalMaxRent >= rent;

    resultSign.textContent = isFinalPass ? "O" : "X";
    resultSign.className = isFinalPass ? "result-title ok" : "result-title warn";

    detailLog.innerHTML = headerHtml + `
      <div class="bonus-box">
        <b>額外加分判定：</b><br>
        ‧ 裝修 (+${decoPct}%)：<b>+ ${decoBonus.toLocaleString()}</b> 元<br>
        ‧ 區位 (+${areaPct}%)：<b>+ ${areaBonus.toLocaleString()}</b> 元<br>
        ‧ 設備 (${checkboxes.length}項)：<b>+ ${equipBonusTotal.toLocaleString()}</b> 元<br>
        <hr style="border:0; border-top:1px solid #f39c12; margin: 10px 0; opacity: 0.3;">
        最終總上限：<b>${finalMaxRent.toLocaleString()}</b> 元<br>
        欲簽約租金：<b>${rent.toLocaleString()}</b> 元<br>
        判定結果：<b style="color:${isFinalPass ? '#27ae60' : '#e74c3c'}">${isFinalPass ? '合規，可開發' : '不合規，租金過高'}</b>
      </div>
    `;
  }
  
  resultArea.scrollIntoView({ behavior: 'smooth' });
};

// 【重要】僅下載結果部分的邏輯
document.getElementById("downloadBtn").onclick = function() {
  const target = document.getElementById("resultArea"); // 只截結果區
  const sh = document.getElementById("sh");
  const wm = document.getElementById("wm");
  const ts = document.getElementById("timestamp");

  // 更新截圖時間
  const now = new Date();
  ts.textContent = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${now.getMinutes()}`;

  // 截圖前：暫時顯示隱藏的標頭與浮水印
  sh.style.display = "block";
  wm.style.display = "block";

  html2canvas(target, {
    scale: 2,
    backgroundColor: "#ffffff",
    logging: false,
    useCORS: true
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = `總管家租金判定_${new Date().getTime()}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();

    // 截圖後：恢復原本畫面的樣子
    sh.style.display = "none";
    wm.style.display = "none";
  });
};

function showError(msg) {
  const resultArea = document.getElementById("resultArea");
  const resultSign = document.getElementById("resultSign");
  const detailLog = document.getElementById("detailLog");
  resultArea.style.display = "block";
  resultSign.textContent = "!";
  resultSign.className = "result-title warn";
  detailLog.innerHTML = `<span style="color:red; font-weight:bold;">${msg}</span>`;
}
</script>

</body>
</html>
